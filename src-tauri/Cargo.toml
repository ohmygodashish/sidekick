[package]
name = "sidekick"
version = "0.1.0"
description = "Sidekick - Hyper-lightweight screen-share invisible desktop copilot"
authors = ["Sidekick Team"]
edition = "2021"

[lib]
name = "sidekick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
cocoa = "0.26"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
foreign-types = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
